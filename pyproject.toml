[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-avatar-agent"
version = "0.1.0"
description = "Turn a topic into a vertical talking-head video: research, LLM script, TTS, SadTalker avatar, ffmpeg composite."
readme = "README.md"
requires-python = ">=3.10,<3.12"  # avatar stack (numpy 1.23.4) has no wheels for 3.12+
dependencies = [
    "requests",
    "pyyaml",
    "python-dotenv",
    "feedparser",
    "pydantic>=2",  # typed config (Task 03)
]

[project.optional-dependencies]
# Text-to-speech (XTTS v2). Maintained Idiap fork; import path is still `TTS`.
# NOTE: cannot be co-installed with the `avatar` extra under SadTalker's exact
# pins (numpy/scipy/librosa/torch); see docs/KNOWN_ISSUES.md.
tts = ["coqui-tts"]
# Talking-head stage. Versions mirror models/sad_talker/requirements.txt and are
# intentionally old for SadTalker compatibility (see docs/KNOWN_ISSUES.md).
avatar = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "numpy==1.23.4",
    "face_alignment==1.3.5",
    "imageio==2.19.3",
    "imageio-ffmpeg==0.4.7",
    "librosa==0.9.2",
    "numba",
    "resampy==0.3.1",
    "pydub==0.25.1",
    "scipy==1.10.1",
    "kornia==0.6.8",
    "tqdm",
    "yacs==0.1.8",
    "joblib==1.1.0",
    "scikit-image==0.19.3",
    "basicsr==1.4.2",
    "facexlib==0.3.0",
    "gfpgan",
    "av",
    "safetensors",
    "opencv-python",
]
# Optional Reddit research source (API access now requires approval).
reddit = ["praw"]
# Default web-search provider for the research stage (DuckDuckGo, no API key).
search = ["ddgs"]
dev = ["pytest", "pytest-cov", "ruff==0.8.6", "pre-commit", "httpx"]  # httpx: FastAPI TestClient
api = ["fastapi", "uvicorn"]

[project.scripts]
ai-avatar = "ai_avatar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_avatar = ["prompts/*.md"]  # LLM prompt templates ship with the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs network, credentials or heavy models (skipped by default)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["models", "gfpgan", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_llm_fake.py" = ["W291"]  # trailing spaces inside a prompt fixture are the point of the test

[tool.ruff.lint.isort]
known-first-party = ["ai_avatar"]

[tool.coverage.run]
source = ["ai_avatar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
