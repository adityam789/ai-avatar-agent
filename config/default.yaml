# Default configuration. Relative paths resolve against the project root.
# Override with `--config FILE` or env vars like AI_AVATAR__tts__device=cpu.

video:
  width: 1080
  height: 1920

avatar:
  image: models/sad_talker/examples/source_image/full_body_1.png
  height_ratio: 0.55   # share of the frame height used by the talking head

background:
  enabled: true
  loop: assets/loops/china_surfer_low.mp4

tts:
  voice: Ana Florence
  language: en
  device: auto         # auto | cpu | cuda | mps (auto/mps handling: Task 08)

llm:               # wired into the LLM client in Task 07
  base_url: https://openrouter.ai/api/v1/chat/completions
  models:
    - meta-llama/llama-3.3-70b-instruct:free

paths:
  outputs_dir: outputs
  sadtalker_dir: models/sad_talker
